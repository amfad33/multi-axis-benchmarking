[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-axis-reproducibility"
version = "0.1.0"
description = "Reproducible multi-axis video-model benchmarking and EEG RSA analyses"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7", "adjustText>=1.3"]

[project.optional-dependencies]
heavy = [
    "torch>=2.2",
    "torchvision>=0.17",
    "opencv-python>=4.8",
    "transformers>=4.53",
    "pytorchvideo>=0.1.5",
    "fvcore>=0.1.5",
    "iopath>=0.1.10",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "einops>=0.7",
    "timm>=0.9",
    "tqdm>=4.66",
]
test = ["pytest>=8"]

[project.scripts]
multi-axis-repro = "multi_axis_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
